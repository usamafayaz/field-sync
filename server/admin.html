<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FieldSync server</title>
<style>
  @font-face{font-family:Plex;src:url(/admin/fonts/IBMPlexSans_400Regular.ttf);font-weight:400}
  @font-face{font-family:Plex;src:url(/admin/fonts/IBMPlexSans_500Medium.ttf);font-weight:500}
  @font-face{font-family:Plex;src:url(/admin/fonts/IBMPlexSans_600SemiBold.ttf);font-weight:600}
  @font-face{font-family:PlexMono;src:url(/admin/fonts/IBMPlexMono_400Regular.ttf)}

  /* Same tokens as the light theme in src/ui/theme.tsx */
  :root{
    --bg:#ECEEEA;--surface:#FAFBF9;--sunken:#E2E6E1;--field:#FFFFFF;
    --text:#1B2420;--muted:#4D5853;--faint:#626C67;--border:#D5DAD5;--border2:#BCC3BD;
    --accent:#1DB954;--accent-pressed:#19A04A;--on-accent:#1B2420;--danger-border:#E3B7B2;
    --ok-fg:#1F6843;--ok-bg:#DCEEE2;--ok-dot:#2E8A5A;
    --warn-fg:#8A4210;--warn-bg:#F8E6D8;--warn-dot:#D9772B;
    --bad-fg:#A2322A;--bad-bg:#F7E1DE;--bad-dot:#C4453D;
    --overlay:rgba(27,36,32,.88);
    color-scheme:light;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Plex,system-ui,sans-serif}
  main{max-width:560px;margin:0 auto;padding:32px 16px 48px}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  h1{font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-.02em;margin:0}
  .counts{margin:6px 0 0;color:var(--muted);font-size:14px}
  .counts b{color:var(--text);font-weight:600}

  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;margin-top:6px}
  .pill i{width:7px;height:7px;border-radius:4px}
  .ok{color:var(--ok-fg);background:var(--ok-bg)} .ok i{background:var(--ok-dot)}
  .warn{color:var(--warn-fg);background:var(--warn-bg)} .warn i{background:var(--warn-dot)}
  .bad{color:var(--bad-fg);background:var(--bad-bg)} .bad i{background:var(--bad-dot)}

  h2{font-size:18px;font-weight:600;margin:28px 0 8px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}

  .mode{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--border);padding:14px 16px;min-height:64px}
  .mode:first-child{border-top:0}
  .mode:hover{background:var(--sunken)}
  .mode span{flex:1}
  .mode b{display:block;font-weight:500}
  .mode small{display:block;color:var(--faint);font-size:14px;line-height:1.4}
  .radio{width:20px;height:20px;border-radius:10px;border:2px solid var(--border2);flex:none}
  .mode[aria-checked=true]{background:var(--sunken)}
  .mode[aria-checked=true] .radio{border:6px solid var(--accent)}

  details{margin-top:12px}
  summary{cursor:pointer;color:var(--muted);font-size:14px;padding:4px 0}
  .knobs{margin-top:8px;padding:4px 16px 16px}
  .knob{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
  .knob:first-child{border-top:0}
  .knob label{font-size:14px}
  .knob label small{display:block;color:var(--faint);font-size:13px}
  .knob input{width:110px;padding:8px 10px;border:1px solid var(--border2);border-radius:10px;background:var(--field);text-align:right;font-family:PlexMono,ui-monospace,monospace;font-size:14px}

  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--border2);background:var(--surface);font-weight:600}
  .btn:hover{background:var(--sunken)}
  .primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);margin-top:12px}
  .primary:hover{background:var(--accent-pressed)}
  .danger{border-color:var(--danger-border);color:var(--bad-fg);margin-top:32px}

  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--overlay);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
  #toast.on{opacity:1}
  @media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>FieldSync server</h1>
      <p class="counts"><b id="committed">–</b> reports stored, <b id="partial">–</b> half-uploaded</p>
    </div>
    <span id="status" class="pill ok"><i></i><span>Healthy</span></span>
  </header>

  <h2>How the server behaves</h2>
  <div class="card" role="radiogroup" aria-label="Server mode" id="modes"></div>

  <details>
    <summary>Custom values</summary>
    <form class="card knobs" id="knobs">
      <div class="knob"><label for="latencyMs">Delay per request<small>milliseconds</small></label><input id="latencyMs" name="latencyMs" type="number" min="0" step="100"></div>
      <div class="knob"><label for="bandwidthBps">Upload speed<small>bytes per second, 0 = unlimited</small></label><input id="bandwidthBps" name="bandwidthBps" type="number" min="0" step="1000"></div>
      <div class="knob"><label for="dropRate">Drop the connection<small>chance, 0 to 1</small></label><input id="dropRate" name="dropRate" type="number" min="0" max="1" step="0.05"></div>
      <div class="knob"><label for="errorRate">Reply 503<small>chance, 0 to 1</small></label><input id="errorRate" name="errorRate" type="number" min="0" max="1" step="0.05"></div>
      <div class="knob"><label for="hangRate">Never answer<small>chance, 0 to 1</small></label><input id="hangRate" name="hangRate" type="number" min="0" max="1" step="0.05"></div>
      <div class="knob"><label for="rejectRate">Refuse uploads (400)<small>chance, 0 to 1</small></label><input id="rejectRate" name="rejectRate" type="number" min="0" max="1" step="0.05"></div>
      <div class="knob"><label for="loseResponseRate">Lose the reply after saving<small>chance, 0 to 1</small></label><input id="loseResponseRate" name="loseResponseRate" type="number" min="0" max="1" step="0.05"></div>
      <button class="btn primary" type="submit">Apply custom values</button>
    </form>
  </details>

  <button class="btn danger" id="wipe">Delete every report on the server</button>
</main>
<div id="toast" role="status"></div>

<script>
  // id, name, what the server does, status pill tone
  const MODES = [
    ['healthy', 'Healthy', 'Answers every request normally.', 'ok'],
    ['2g', 'Slow 2G', '800 ms delay and about 6 KB/s.', 'warn'],
    ['flaky', 'Flaky', 'Drops uploads, random 503s, loses some replies.', 'warn'],
    ['demo', 'Demo', 'About 0.8 MB/s, drops some uploads, always loses the reply after saving.', 'warn'],
    ['down', 'Down', 'Every request gets 503. The app retries.', 'bad'],
    ['black-hole', 'Black hole', 'Accepts requests and never answers. The app times out.', 'bad'],
    ['refuse', 'Refuse uploads', 'Every upload gets 400. The app stops and asks the user.', 'bad'],
  ];
  const $ = id => document.getElementById(id);
  const form = $('knobs');
  const post = (url, body) =>
    fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }).then(r => r.json());
  const toast = text => { $('toast').textContent = text; $('toast').classList.add('on'); setTimeout(() => $('toast').classList.remove('on'), 1600); };

  $('modes').innerHTML = MODES.map(([id, name, what]) =>
    `<button class="mode" role="radio" aria-checked="false" data-mode="${id}"><span><b>${name}</b><small>${what}</small></span><i class="radio"></i></button>`).join('');

  function show(state) {
    $('committed').textContent = state.committedReports;
    $('partial').textContent = state.partialUploads;
    const mode = MODES.find(m => m[0] === state.mode);
    $('status').className = 'pill ' + (mode ? mode[3] : 'warn');
    $('status').querySelector('span').textContent = mode ? mode[1] : 'Custom';
    document.querySelectorAll('.mode').forEach(b => b.setAttribute('aria-checked', String(b.dataset.mode === state.mode)));
    if (!form.contains(document.activeElement)) for (const [k, v] of Object.entries(state.faults)) form.elements[k].value = v;
  }
  const refresh = () => fetch('/admin/state').then(r => r.json()).then(show).catch(() => {});

  document.querySelectorAll('.mode').forEach(b => (b.onclick = async () => {
    await post('/admin/faults', { preset: b.dataset.mode });
    await refresh();
    toast(`Server is now ${b.querySelector('b').textContent}`);
  }));

  form.onsubmit = async e => {
    e.preventDefault();
    const body = {};
    for (const el of form.elements) if (el.name) body[el.name] = Number(el.value) || 0;
    await post('/admin/faults', body);
    await refresh();
    toast('Custom values applied');
  };

  // Deleting needs a second click within 4 seconds.
  const wipe = $('wipe');
  let armed = null;
  wipe.onclick = async () => {
    if (!armed) {
      wipe.textContent = 'Click again to delete everything';
      armed = setTimeout(() => { armed = null; wipe.textContent = 'Delete every report on the server'; }, 4000);
      return;
    }
    clearTimeout(armed);
    armed = null;
    wipe.textContent = 'Delete every report on the server';
    await post('/admin/wipe');
    await refresh();
    toast('Every report on the server was deleted');
  };

  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
